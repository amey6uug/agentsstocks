name: Publish snapshot

# NSE trades 09:15-15:30 IST = 03:45-10:00 UTC. GitHub cron is UTC only, so
# these fire through the Indian session and once just after the close.
on:
  schedule:
    - cron: "15 4,6,8,10 * * 1-5"
  workflow_dispatch:        # run on demand from the Actions tab

# Pages here is configured as: branch main, folder /docs. The job rebuilds
# docs/index.html and commits it back to main; Pages picks it up from there.
# That needs write access to contents, not pages:write.
permissions:
  contents: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the snapshot
        env:
          EXPORT_INDEX: ${{ vars.EXPORT_INDEX || 'nifty50' }}
          EXPORT_COUNT: ${{ vars.EXPORT_COUNT || '6' }}
          EXPORT_TIMEFRAME: ${{ vars.EXPORT_TIMEFRAME || '1d' }}
          # Optional. The claude CLI does not exist on a runner, so without a
          # key the deterministic engine runs instead.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ secrets.ANTHROPIC_API_KEY && 'anthropic' || 'deterministic' }}
        run: python export_static.py
      - name: Commit the rebuilt page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/index.html docs/data.json docs/.nojekyll
          # Nothing to do when the numbers are unchanged; avoids empty commits.
          git diff --staged --quiet && echo "no change" && exit 0
          git commit -m "Snapshot $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
